# artctl brand kit. See SPEC.md in the artctl repo for every field.
name = "Calipers"
# One line: what the product is and who it is for. Sent with every request.
description = "Personal Firefox add-on: select a measurement on a page, right-click, and the context menu shows the unit conversions. For Max's own use."

[style]
# How everything should look, in a sentence or two.
summary = "Bold app icons: one striking subject that fills the frame, with rich light and depth (glow, soft shading, gradients), on a full-bleed rounded square, in the manner of the example refs."
# Hard rules the model must follow.
rules = ["One bold subject that fills the frame", "Rich light and depth: glow, soft shading, gradients", "Strong silhouette that reads at 64px", "Full-bleed rounded square"]
# Things that must never appear.
avoid = ["line art", "thin outlines", "diagram-like combinations of objects", "text or numbers", "the Firefox logo or any browser logo", "photorealism"]

[palette]
# name = "#RRGGBB"
firefox_orange = "#FF7139"
steel_grey = "#5B6670"

[generate]
provider = "chatgpt"  # chatgpt (free, via headfull), gemini, openai (paid APIs), mock (offline)
# chatgpt takes up to 10 images per request (refs plus any --from image).
size = "1K"           # gemini: 512, 1K, 2K, 4K. openai: 1K, or WxH
aspect = "1:1"
quality = "medium"    # openai only: low, medium, high

[chatgpt]
# ChatGPT project URL for this brand. Every image is made in a chat inside it,
# so the brand's work stays together and out of the main ChatGPT history.
# "none" for a one-off with no project; left empty, gen warns.
project = "none"

[budget]
per_call_usd = 1.00
daily_usd = 5.00

[review]
# agent: anyone may approve. human: approval needs a person at a terminal or
# a click on the review page.
mode = "agent"

# Reference images. always = true attaches it to every generation.
# role is one of: logo, mascot, example, reference.

[[refs]]
path = "refs/liked-blinder.png"
role = "example"
note = "An approved logo from another of Max's projects that he liked; match its quality and depth, not its subject."
always = false

